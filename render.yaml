services:
  - type: web
    name: movie-explorer-api
    runtime: docker
    # Paths below are relative to the Root Directory (backend/) set in Render dashboard
    dockerfilePath: ./movie-explorer-api/movie-explorer-api/Dockerfile
    dockerContext: ./movie-explorer-api/movie-explorer-api
    port: 8080
    envVars:
      - key: PORT
        value: 8080
