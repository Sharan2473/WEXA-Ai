services:
  - type: web
    name: movie-explorer-api
    runtime: docker
    dockerfilePath: ./backend/movie-explorer-api/movie-explorer-api/Dockerfile
    # Build context is the repo root (default), so COPY paths in the
    # Dockerfile must be relative to the repo root.
    dockerContext: .
    port: 8080
    envVars:
      - key: PORT
        value: 8080
